name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug-сборка без R8: всегда собирается и ставится как отдельное приложение (*.debug).
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: server-manager-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Постоянный ключ подписи берётся из секретов репозитория (см. README).
      # Без секретов release подписывается временным debug-ключом раннера.
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release будет подписан ключом из секретов"
          else
            echo "::warning::Секрет SIGNING_KEYSTORE_BASE64 не задан — release подписан временным ключом, обновление поверх старой версии будет невозможно"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ServerManager-${{ github.run_number }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: server-manager-release-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

  # Уборка: после успешной сборки удаляются артефакты прошлых запусков
  # и старые запуски (остаются последние KEEP_RUNS). APK в GitHub Releases не затрагиваются.
  cleanup:
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      KEEP_RUNS: 10
    steps:
      - name: Delete old artifacts and workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRun = context.runId;
            const keepRuns = Number(process.env.KEEP_RUNS);

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            let deletedArtifacts = 0;
            for (const a of artifacts) {
              if (a.workflow_run && a.workflow_run.id === currentRun) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              deletedArtifacts++;
              core.info(`Удалён артефакт ${a.name}`);
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'android-build.yml', status: 'completed', per_page: 100,
            });
            const old = runs
              .filter(r => r.id !== currentRun)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(keepRuns);
            for (const r of old) {
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
              core.info(`Удалён запуск #${r.run_number}`);
            }
            core.info(`Артефактов удалено: ${deletedArtifacts}, запусков удалено: ${old.length}`);
